# backend/docker-compose.yml
version: "3.9"
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # No KC_DB_* here: start-dev uses Keycloak's embedded database, persisted in the
      # keycloak-data volume below. To share your local Postgres instead, add:
      #   KC_DB: postgres
      #   KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/sentinel
      #   KC_DB_SCHEMA: keycloak          (run: CREATE SCHEMA keycloak;)
      #   KC_DB_USERNAME / KC_DB_PASSWORD
    volumes:
      - keycloak-data:/opt/keycloak/data/h2
      # Directory name is lowercase to match the repo (backend/keycloak). The old
      # ./Keycloak path only worked on case-insensitive filesystems (Windows/macOS).
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"

